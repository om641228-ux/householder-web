<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><style>
  body { font: 13px -apple-system, sans-serif; width: 300px; padding: 12px; }
  input { width: 100%; box-sizing: border-box; padding: 7px; margin: 3px 0 8px; border: 1px solid #d0d0d5; border-radius: 7px; }
  button { width: 100%; padding: 9px; border: none; border-radius: 8px; background: #0071e3; color: #fff; font-weight: 700; cursor: pointer; margin-top: 4px; }
  button.stop { background: #e74c3c; }
  #st { margin-top: 8px; font-size: 12px; color: #555; white-space: pre-wrap; }
</style></head>
<body>
  <b>⚙️ Подключение</b>
  <input id="api" placeholder="API URL, напр. https://householder-api-prod….app">
  <input id="token" placeholder="Токен (из адресной строки ?token=…)">
  <button id="save">💾 Сохранить</button>
  <hr>
  <b>💶 Сбор цен (товары без цены)</b>
  <button id="go">▶ Собрать 20 цен</button>
  <button id="stop" class="stop">⏹ Остановить</button>
  <div id="st"></div>
  <script src="popup.js"></script>
</body>
</html>
