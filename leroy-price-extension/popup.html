<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><style>
  body { font: 13px -apple-system, sans-serif; min-width: 280px; max-width: 460px; margin: 0 auto; padding: 12px; } /* v1.19.0: боковая панель */
  input, select { width: 100%; box-sizing: border-box; padding: 7px; margin: 3px 0 8px; border: 1px solid #d0d0d5; border-radius: 7px; }
  button { width: 100%; padding: 9px; border: none; border-radius: 8px; background: #0071e3; color: #fff; font-weight: 700; cursor: pointer; margin-top: 4px; }
  button.all { background: #7c3aed; }
  button.stop { background: #e74c3c; }
  #st { margin-top: 8px; font-size: 12px; color: #555; white-space: pre-wrap; max-height: 130px; overflow-y: auto; }
</style></head>
<body>
  <b>⚙️ Подключение</b>
  <input id="api" placeholder="API URL, напр. https://householder-api-prod….app">
  <input id="token" placeholder="Токен (из адресной строки ?token=…)">
  <button id="save">💾 Сохранить</button>
  <hr>
  <b>💶 Сбор цен</b>
  <select id="site">
    <option value="">🌐 Все магазины</option>
    <option value="www.leroymerlin.es">🗂 Leroy Merlin</option>
    <option value="canarias.worten.es">🛒 Worten Canarias</option>
    <option value="canarias.mediamarkt.es">🛒 MediaMarkt Canarias</option>
    <option value="www.tutrebol.es">🍀 TuTrebol</option>
  </select>
  <select id="mode">
    <option value="pending">🆕 Товары без цены</option>
    <option value="stale">🔄 Обновить старые цены</option>
  </select>
  <label style="font-size:11px;color:#555">Цена старше N дней — для режима «🔄 Обновить старые»:</label>
  <input id="days" type="number" min="1" max="90" value="7">
  <label style="font-size:11px;color:#555">Размер пачки — сколько товаров за один проход (1–100):</label>
  <input id="batch" type="number" min="1" max="100" value="20">
  <button id="go">▶ Собрать пачку</button>
  <button id="goall" class="all">▶▶ Собрать ВСЁ (до конца очереди)</button>
  <button id="stop" class="stop">⏹ Остановить</button>
  <hr>
  <b>🗂 Парсинг раздела (все страницы до конца)</b>
  <input id="secUrl" placeholder="URL раздела, напр. …/productos/jardin-y-terraza.html">
  <button id="secGo">🗂 Парсить раздел</button>
  <label style="font-size:11px;color:#555">Или файл со списком разделов (.txt, один URL на строку):</label>
  <input id="secFile" type="file" accept=".txt,.csv,text/plain" style="padding:5px">
  <button id="secFileGo" style="background:#0e7490">📂 Парсить разделы из файла</button>
  <button id="brGo" style="background:#0e7490">🏷 Обновить справочник брендов</button>
  <hr>
  <b>⏰ Автозапуск</b>
  <select id="sched">
    <option value="0">выключен</option>
    <option value="6">каждые 6 часов</option>
    <option value="12">каждые 12 часов</option>
    <option value="24">каждые 24 часа</option>
  </select>
  <button id="schedSave">💾 Применить расписание</button>
  <div id="runind" style="font-weight:700;font-size:12px;color:#8e8e93;margin:6px 0 2px;">■ остановлен</div>
  <div id="st" style="white-space:pre-wrap;background:#f5f5f7;border-radius:8px;padding:8px;font-size:11.5px;min-height:20px;"></div>
  <script src="popup.js"></script>
</body>
</html>
